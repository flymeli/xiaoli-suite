    function readFiles(files, kind) {
      [...files].slice(0, 9).forEach(file => {
        const image = file.type.startsWith('image/');
        const video = file.type.startsWith('video/');
        if(kind==='image' && !image) { toast('请选择图片'); return; }
        if(kind==='video' && !video) { toast('请选择视频'); return; }
        if(file.size > 12*1024*1024) { toast('文件超过 12MB，请换一个小一些的'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          if(image) {
            if(state.editorImages.length>=9) { toast('最多 9 张图片'); return; }
            state.editorImages.push({src:String(reader.result), alt:file.name||'本地图片'});
            XiaoliFeed.save(state);
            if(state.route==='editorPost') render();
          }
          if(video) {
            state.videoSrc = String(reader.result);
            state.editorKind = 'video';
            toast('已使用本地视频预览');
            if(state.route==='editorVideo') render();
          }
        };
        reader.readAsDataURL(file);
      });
    }
    async function captureFrame() {
      if(!navigator.mediaDevices || !window.isSecureContext) {
        toast('这里不能打开摄像头。可以选本地图片，或使用示例图片。');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({video:true});
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        const canvas = document.createElement('canvas');
        canvas.width = 640; canvas.height = 480;
        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
        stream.getTracks().forEach(track => track.stop());
        if(state.editorImages.length>=9) { toast('最多 9 张图片'); return; }
        state.editorImages.push({src:canvas.toDataURL('image/jpeg', 0.8), alt:'拍摄的照片'});
        toast('已加入刚拍摄的照片');
        render();
      } catch (error) {
        toast('没有获得摄像头权限。可以选本地图片，或使用示例图片。');
      }
    }

    function updateNativeVideoUI(video) { const stage=video.closest('.video-stage'); const playing=!video.paused&&!video.ended; state.videoPlaying=playing; state.videoEnded=video.ended; stage?.classList.toggle('playing',playing); const duration=Number.isFinite(video.duration)?video.duration:20; state.videoProgress=duration?video.currentTime/duration*100:0; stage?.style.setProperty('--video-progress',`${state.videoProgress}%`); stage?.querySelectorAll('[data-action="native-video"]').forEach(button=>{ button.innerHTML=icon(playing?'pause':'play'); button.setAttribute('aria-label',playing?'暂停':'播放'); }); const range=stage?.querySelector('[data-field="nativeVideoProgress"]'); if(range) range.value=state.videoProgress; const time=stage?.querySelector('[data-video-time]'); if(time) time.textContent=`${videoTime(video.currentTime)} / ${videoTime(duration)}`; const status=stage?.querySelector('[data-video-status]'); if(status) status.textContent=video.ended?'播放结束':playing?'正在播放':state.videoStatus==='loading'?'正在缓冲':'已暂停'; const loading=stage?.querySelector('[data-video-loading]'); if(loading) loading.hidden=state.videoStatus!=='loading'; const error=stage?.querySelector('[data-video-error]'); if(error) error.hidden=state.videoStatus!=='error'; }
    function bindNativeVideo() { const video=document.getElementById('campus-video'); if(!video) return; video.muted=state.videoMuted; video.addEventListener('loadstart',()=>{ state.videoStatus='loading'; updateNativeVideoUI(video); }); video.addEventListener('loadedmetadata',()=>{ state.videoStatus='ready'; updateNativeVideoUI(video); }); video.addEventListener('canplay',()=>{ state.videoStatus=video.paused?'ready':'playing'; updateNativeVideoUI(video); }); video.addEventListener('waiting',()=>{ state.videoStatus='loading'; updateNativeVideoUI(video); }); video.addEventListener('playing',()=>{ state.videoStatus='playing'; updateNativeVideoUI(video); }); video.addEventListener('pause',()=>{ if(!video.ended) state.videoStatus='ready'; updateNativeVideoUI(video); }); video.addEventListener('timeupdate',()=>updateNativeVideoUI(video)); video.addEventListener('ended',()=>{ state.videoStatus='ended'; updateNativeVideoUI(video); }); video.addEventListener('error',()=>{ state.videoStatus='error'; state.videoError=true; updateNativeVideoUI(video); }); }

    function renderProfileOther(data) { const profiles={"阿澈":{school:"南川大学",bio:"喜欢摄影、跑步和校园建筑。"},"小禾":{school:"北屿理工大学",bio:"记录社团活动和校园里的新鲜事。"},"顾言":{school:"南川大学",bio:"正在准备期中考试，也在寻找学习搭子。"}}; const profile=profiles[state.activeProfile]||profiles["阿澈"]; const works=data.filter(item=>item.author===state.activeProfile).slice(0,2); return `<div class="page"><section class="panel profile-head"><span class="avatar large ${avatarClass(state.activeProfile)}">${esc(state.activeProfile.slice(0,1))}</span><h1>${esc(state.activeProfile)}</h1><p class="support">${profile.school} · 已认证学生</p><p class="lead" style="margin-top:10px">${profile.bio}</p><div class="stats"><div class="stat"><strong>${Math.max(works.length,2)}</strong><span>作品</span></div><div class="stat"><strong>38</strong><span>关注</span></div><div class="stat"><strong>64</strong><span>粉丝</span></div></div><div class="row"><button class="button secondary grow" data-action="follow">关注</button><button class="button primary grow" data-go="messageRequest">发私信请求</button></div></section>${works.length?`<div class="od-stack" style="--od-gap:12px">${works.map(item=>postCard(item)).join('')}</div>`:status('还没有全站可见作品','对方的本校限定内容不会在这里展示。')}</div>`; }
    function renderEditorPost() { const media=state.editorImages.map((item,index)=>`<article class="media-item" aria-current="${index===state.coverIndex}"><button class="media-cover-choice" data-image-action="cover" data-index="${index}" aria-label="设为封面"><img src="${item.src}" width="320" height="240" alt="${esc(item.alt)}"></button><div class="media-item-meta"><button data-image-action="left" data-index="${index}" aria-label="向前移动" ${index===0?'disabled':''}>${icon('back')}</button><span class="meta">${index===state.coverIndex?'封面':index+1}</span><button data-image-action="right" data-index="${index}" aria-label="向后移动" ${index===state.editorImages.length-1?'disabled':''}>${icon('chevron')}</button><button data-image-action="delete" data-index="${index}" aria-label="删除图片">${icon('trash')}</button></div></article>`).join(''); return `<div class="page"><div class="editor-status"><span>图文作品 · 最多 9 张</span><span data-autosave-status>${state.draftDirty?'正在保存…':state.draftSavedAt}</span></div><div class="media-strip">${media}<button class="media-add" data-action="pick-image">${icon('plus')}<span>相册</span></button><button class="media-add" data-action="capture-photo">${icon('image')}<span>拍照</span></button><button class="media-add" data-action="use-sample-image">${icon('image')}<span>示例图片</span></button></div><p class="meta">点击图片设为封面，使用箭头调整顺序。</p><label class="field"><span>标题（可选，最多 30 字）</span><input class="input" data-field="draftTitle" maxlength="30" value="${esc(state.draftTitle)}" placeholder="写一个清楚的标题"></label><label class="field"><span>正文</span><textarea class="input" rows="8" data-field="draft" maxlength="2000" placeholder="至少 2 个字。用 > 写引用，用 - 写列表">${esc(state.draft)}</textarea><span class="meta">${state.draft.length} / 2000</span></label><div class="list">${listRow('频道','校园生活',null,'chevron')}${listRow('话题','周末操场',null,'chevron')}${listRow('发布范围',state.scope,'publishOptions','chevron')}</div><button class="button primary full" data-go="publishOptions">下一步</button>     function renderPublishOptionsComplete() { return `<div class="page"><section class="card"><p class="eyebrow">发布预览</p><h2 style="margin-top:6px">${esc(state.draftTitle||'无标题作品')}</h2><p class="support">${esc(state.draft.slice(0,72))}</p><p class="meta" style="margin-top:8px">${state.editorKind==='video'?'1 个视频':`${state.editorImages.length} 张图片`} · 南川大学</p></section><section class="card"><h2>谁可以看到？</h2><p class="support">作品不会互联网公开。</p><div class="segment" style="--count:2;margin-top:14px"><button data-scope="仅本校" aria-pressed="${state.scope==='仅本校'}">仅本校</button><button data-scope="全站已认证学生" aria-pressed="${state.scope==='全站已认证学生'}">全站已认证学生</button></div></section><div class="list">${listRow('发布学校','南川大学 · 只读',null,'lock')}${listRow('频道','校园生活',null,'chevron')}${listRow('话题','周末操场',null,'chevron')}</div>${state.scope==='全站已认证学生'?status('确认扩大范围','其他学校的认证学生也可以查看；取消会保留“仅本校”。','warning'):''}<button class="button primary full" data-action="publish-complete">确认发布</button><button class="button ghost full" data-action="save-draft">保存草稿</button></div>`; }
    function renderPublishProgressComplete() { const current=state.publishStatus; if(current==='uploading') return `<div class="page"><section class="publish-state-card"><span class="badge warn">上传中</span><h1>正在上传媒体</h1><p class="support">仅重试失败文件，正文和媒体顺序会保留。</p><div class="upload-progress" style="--upload-progress:${state.uploadProgress}%"><span></span></div><div class="row between"><span class="meta">${state.uploadProgress}%</span><button class="chip" data-action="cancel-upload">取消上传</button></div></section><button class="button ghost full" data-go="mine">离开并在“我的”查看</button></div>`; if(current==='failed') return `<div class="page">${status('上传未完成',state.publishError||'网络中断，文字、封面和媒体顺序均已保留。','danger',`<button class="button primary" data-action="retry-upload">重试失败文件</button>`)}<button class="button ghost full" data-go="editorPost">返回编辑</button></div>`; if(current==='processing') return `<div class="page">${steps([["上传媒体","已完成"],["媒体处理","正在生成可播放文件"],["内容审核","尚未开始"],["发布完成","通过后可见"]],1)}${status('媒体处理中','可以离开页面，处理完成后会进入内容审核。','warning',`<button class="button secondary" data-action="advance-publish">刷新状态</button>`)}</div>`; if(current==='reviewing') return `<div class="page">${steps([["上传媒体","已完成"],["媒体处理","已完成"],["内容审核","正在审核"],["发布完成","等待结果"]],2)}${status('内容审核中','上传成功不等于发布成功；结果会通过消息通知。','warning',`<button class="button secondary" data-action="advance-publish">刷新审核结果</button>`)}</div>`; if(current==='rejected') return `<div class="page">${status('需要修改后重新提交','封面文字与正文内容不一致，请调整后再次提交。','danger',`<button class="button primary" data-go="editorPost">修改作品</button>`)}<button class="button ghost full" data-action="appeal">申请复核</button></div>`; return `<div class="page">${status('作品已发布',`已按“${state.scope}”范围发布。`,'',`<button class="button primary" data-go="postDetail">查看作品</button>`)}<button class="button ghost full" data-go="myWorks">返回我的作品</button></div>`; }
    function renderDraftsComplete() { const tabs=`<div class="draft-tabs">${['草稿','处理中','未通过'].map(tab=>`<button data-draft-tab="${tab}" aria-pressed="${state.draftTab===tab}">${tab}</button>`).join('')}</div>`; if(state.draftTab==='处理中') return `<div class="page">${tabs}<article class="publish-state-card"><div class="row between"><span class="badge warn">${state.publishStatus==='published'?'已完成':'处理中'}</span><span class="meta">刚刚更新</span></div><h2>${esc(state.draftTitle||'无标题作品')}</h2><p class="support">${state.publishStatus==='uploading'?`上传 ${state.uploadProgress}%`:state.publishStatus==='failed'?'上传失败，可恢复':'媒体处理与审核状态可继续查看'}</p><button class="button secondary full" data-go="publishProgress">查看进度</button></article><article class="publish-state-card"><span class="badge warn">上传失败</span><h2>校园采访片段</h2><p class="support">网络中断，仅需重试视频文件。</p><button class="button secondary full" data-action="retry-upload">重试上传</button></article></div>`; if(state.draftTab==='未通过') return `<div class="page">${tabs}<article class="publish-state-card"><span class="badge danger">审核未通过</span><h2>社团招新记录</h2><p class="support">封面文字与正文不一致，原稿和媒体仍然保留。</p><div class="row"><button class="button primary grow" data-go="editorPost">修改后重提</button><button class="button ghost" data-action="appeal">申请复核</button></div></article></div>`; return `<div class="page">${tabs}<article class="card"><div class="row between"><span class="badge">本机保存</span><span class="meta">${state.draftSavedAt}</span></div><h2 style="margin-top:10px">${esc(state.draftTitle||state.draft)}</h2><p class="support">图文 · ${state.editorImages.length} 张媒体 · 南川大学</p><div class="row" style="margin-top:14px"><button class="button secondary grow" data-go="editorPost">继续编辑</button><button class="icon-btn" data-action="delete-draft" aria-label="删除草稿">${icon('trash')}</button></div></article></div>`; }
    function plazaItems(data) { const visible=data.filter(item=>item.scope==='全站已认证学生'&&(state.plazaSchool==='全部学校'||item.school===state.plazaSchool)); if(state.plazaTab==='关注') return visible.filter(item=>['阿澈','小禾'].includes(item.author)); if(state.plazaTab==='精选') return [...visible].sort((a,b)=>b.likes-a.likes); if(state.plazaTab==='最新') return visible; return visible.filter(item=>item.channel===state.plazaTab); }

    /** 渲染完整应用并恢复当前页面滚动。 */

    /** 处理应用内所有点击动作。 */
    function handleClick(event) { const target=event.target.closest('button,[data-go]'); if(!target) return; event.stopPropagation(); if(target.dataset.go){ go(target.dataset.go); return; } const action=target.dataset.action; if(action==='back'){back();return;} if(action==='close-dialog'){document.getElementById('confirm-dialog').close();return;} if(action==='send-code'){toast('请输入 6 位验证码后继续');return;} if(action==='login'){if(!state.phone||!state.code||!state.agreed){toast('请填写手机号和验证码并同意协议');return;} state.loggedIn=true; state.registered=true; toast('已登录'); go('auth');return;} if(action==='create-account'){if(!state.nickname.trim()){toast('请输入昵称');return;} state.registered=true;go('auth');return;} if(action==='enter-after-auth'){if(XiaoliAuth.allowSchoolFeed(state)){state.verified=true;state.history=[];state.route='campus';render();}else go('campus');return;} if(action==='accept-agreement'){state.agreed=true;back();return;} if(action==='submit-auth'){go('authStatus');return;} if(action==='like'){state.liked=!state.liked;toast(state.liked?'已点赞':'已取消点赞');render();return;} if(action==='save'){state.saved=!state.saved;toast(state.saved?'已收藏，仅自己可见':'已取消收藏');render();return;} if(action==='share'){toast('已准备受控链接，外部只显示品牌通用说明');return;} if(action==='more-post'){confirmAction('更多操作','可以举报作品，作者本人还可编辑、调整范围或删除。',()=>go('report'));return;} if(action==='report-comment'){go('report');return;} if(action==='comment-like'){toast('已更新评论点赞状态');return;} if(action==='comment-reply'){toast('已进入回复状态');return;} if(action==='comment-more'){toast('已展开更多回复');return;} if(action==='comment-media'){toast('可添加一张评论图片');return;} if(action==='comment-mention'){toast('可提及已互动的认证同学');return;} if(action==='pick-image'){toast('将按需调用系统照片选择，不申请无关权限');return;} if(action==='pick-video'){toast('可选择一个 3–180 秒的视频');return;} if(action==='save-draft'){toast('草稿已保存在本机，并按账号隔离');go('drafts');return;} if(action==='publish'){confirmAction('确认发布范围',`作品将发布给“${state.scope}”，上传完成后仍需处理和审核。`,()=>go('publishProgress'));return;
